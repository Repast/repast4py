name: ci-build

on:
  # Schedule and workflow_dispatch (manual) only work on default branch
  schedule:
    - cron: "0 6 * * *"   # Fire at 06:00 AM every day
  workflow_dispatch:      
  pull_request:
  push:
    branches:
      - develop
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - windows-2022
          - macos-14

        mpi:
          - msmpi
          - mpich
        
        exclude:
          - os: windows-2022
            mpi: mpich
          - os:  macos-14
            mpi: msmpi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MPI (${{ matrix.mpi }})
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: ${{ matrix.mpi }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Upgrade pip
        run:  python -m pip install -U pip

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.17.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        
        env:
          CIBW_ARCHS_WINDOWS: "AMD64 x86"

          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ENVIRONMENT_MACOS: "CC=mpicxx CXX=mpicxx"

          CIBW_BUILD: cp37-* cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*
          
          # Disable building PyPy wheels on all platforms
          CIBW_SKIP: pp*

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_wheels_mock:
    name: Build mock (single-rank) wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Upgrade pip
        run:  python -m pip install -U pip

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.17.0

      # No MPI is set up on any platform: the single-rank (mock) build requires
      # neither a native MPI nor mpi4py.
      - name: Build mock wheels
        run: python -m cibuildwheel --output-dir wheelhouse

        env:
          # Single-rank build. The dynamic build backend omits mpi4py; CC=mpicxx is
          # deliberately NOT set (unlike the native-MPI job above).
          CIBW_ENVIRONMENT: "R4PY_SINGLE_RANK=1"

          CIBW_ARCHS_WINDOWS: "AMD64 x86"

          CIBW_ARCHS_MACOS: "arm64"

          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-*

          # Disable building PyPy wheels on all platforms
          CIBW_SKIP: pp*

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-mock-${{ matrix.os }}
          path: ./wheelhouse/*.whl
