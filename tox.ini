# tox configuration file
#
# Tests both build modes:
#   *-mpi  : default native-MPI build (CC=CXX=mpicxx), runs the parallel suites
#   *-mock : single-rank build (R4PY_NO_MPI=1), no native MPI / mpi4py
#
# Run all: `tox`. One mode: `tox -f mpi` / `tox -f mock`. One env: `tox -e py312-mock`.
[tox]
envlist = py{310,311,312,313,314}-{mpi,mock}

[testenv]
# Build the package per-env in commands_pre (non-editable) so the build mode can
# be selected via env vars. It must stay non-editable: an editable install builds
# in place and would overwrite the in-tree _*.so and _mpi_config.py with whichever
# mode ran last. Non-editable builds keep out of the source tree (see the build /
# build_py / build_ext subclasses in setup.py).
skip_install = true
allowlist_externals = mpirun
pass_env =
    PATH
    LD_LIBRARY_PATH
    HOME
    TMPDIR
set_env =
    RDMAV_FORK_SAFE=1
    HWLOC_COMPONENTS=-gl
    mpi: CC=mpicxx
    mpi: CXX=mpicxx
    mock: R4PY_NO_MPI=1
commands_pre =
    python -m pip install .
commands =
    python -m unittest discover tests
    mpi: mpirun -n 9 --oversubscribe python -m unittest tests.shared_obj_tests
    mpi: mpirun -n 9 --oversubscribe python -m unittest tests.shared_vl_tests
    mpi: mpirun -n 9 --oversubscribe python -m unittest tests.ctopo_tests
    mpi: mpirun -n 18 --oversubscribe python -m unittest tests.shared_obj_tests.SharedGridTests.test_buffer_data_3d
    mpi: mpirun -n 18 --oversubscribe python -m unittest tests.shared_obj_tests.SharedGridTests.test_buffer_data_3d_periodic
    mpi: mpirun -n 4 --oversubscribe python -m unittest tests.logging_tests
    mpi: mpirun -n 4 --oversubscribe python -m unittest tests.shared_network_tests
